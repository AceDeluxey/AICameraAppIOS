name: AICameraApp

options:
  bundleIdPrefix: com.acedeluxey
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  AICameraApp:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        INFOPLIST_FILE: Config/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.acedeluxey.aicamera
        PRODUCT_NAME: AICameraApp
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - AICameraAppTests
        - AICameraAppUITests
      gatherCoverageData: true

  AICameraAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: AICameraApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.acedeluxey.aicamera.tests

  AICameraAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: AICameraApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.acedeluxey.aicamera.uitests
        TEST_TARGET_NAME: AICameraApp
