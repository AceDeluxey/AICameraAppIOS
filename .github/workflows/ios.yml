name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftformat swiftlint

      - name: Check formatting
        run: swiftformat Sources Tests UITests --lint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Test model conversion tooling
        run: |
          python3 tools/test_convert_efficientdet.py
          python3 tools/test_compare_detection_outputs.py
          python3 -m py_compile tools/*.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project AICameraApp.xcodeproj \
            -scheme AICameraApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log || {
              grep -E '(^|:) error:|SwiftCompile.*failed' xcodebuild.log |
                while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }

      - name: Run unit tests
        run: >-
          xcodebuild
          -project AICameraApp.xcodeproj
          -scheme AICameraApp
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          -only-testing:AICameraAppTests
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project AICameraApp.xcodeproj \
            -scheme AICameraApp \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:AICameraAppUITests \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee ui-tests.log || {
              grep -E 'Test Case.*failed|Assertion Failure|UI Testing Failure|(^|:) error:' ui-tests.log |
                while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }
